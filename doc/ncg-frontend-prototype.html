<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NCG · TongNCS 配置治理控制台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0B0E11; --panel:#12161B; --panel2:#171C22; --panel3:#1C2229;
  --line:#242B33; --line2:#323C47; --text:#E7E4DC; --muted:#8B929B; --dim:#5A626C;
  --volt:#D8FF3E; --amber:#FFB347; --red:#FF5C5C; --cyan:#6FE3FF; --green:#7CE7B2;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:'Instrument Sans',system-ui,-apple-system,sans-serif;
  --disp:'Bricolage Grotesque','Instrument Sans',sans-serif;
  --r:3px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--ink); color:var(--text); font-family:var(--sans);
  font-size:14px; line-height:1.55; -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
body::before{
  content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
  background-image:
    radial-gradient(900px 520px at 78% -8%, rgba(216,255,62,.075), transparent 62%),
    radial-gradient(700px 420px at 8% 108%, rgba(111,227,255,.05), transparent 60%),
    linear-gradient(rgba(255,255,255,.028) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.028) 1px, transparent 1px);
  background-size:auto,auto,42px 42px,42px 42px;
  mask-image:linear-gradient(180deg,#000 0%,#000 70%,rgba(0,0,0,.4) 100%);
}
::selection{background:var(--volt);color:#0B0E11}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#2A323C;border-radius:9px}
::-webkit-scrollbar-thumb:hover{background:#3A4552}
::-webkit-scrollbar-track{background:transparent}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:inherit;text-decoration:none}
input,textarea,select{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line2);border-radius:var(--r);padding:9px 11px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--volt);box-shadow:0 0 0 2px rgba(216,255,62,.15)}
.mono{font-family:var(--mono)}
.dim{color:var(--muted)}
.tiny{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* ---------- shell ---------- */
.app{position:relative;z-index:1;height:100vh}
.rail{
  position:fixed;inset:0 auto 0 0;width:250px;display:flex;flex-direction:column;
  border-right:1px solid var(--line);
  background:linear-gradient(180deg,rgba(18,22,27,.94),rgba(11,14,17,.98));
  backdrop-filter:blur(14px);z-index:20;
}
.brand{display:flex;align-items:center;gap:11px;padding:22px 20px 18px;border-bottom:1px solid var(--line)}
.brand-mark{
  width:35px;height:35px;border:1px solid var(--volt);color:var(--volt);
  display:grid;place-items:center;font-family:var(--disp);font-weight:800;font-size:15px;
  letter-spacing:-.04em;position:relative;flex:none;
}
.brand-mark::after{content:'';position:absolute;right:-4px;bottom:-4px;width:7px;height:7px;background:var(--volt)}
.brand-name{font-family:var(--disp);font-weight:800;font-size:15px;letter-spacing:-.01em;line-height:1.15}
.brand-sub{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin-top:2px}
nav{flex:1;overflow-y:auto;padding:14px 10px 20px}
.nav-group{margin:14px 0 6px;padding:0 11px}
.nav-item{
  width:100%;display:flex;align-items:center;gap:10px;padding:9px 11px;margin:1px 0;
  color:var(--muted);border-left:2px solid transparent;border-radius:0 3px 3px 0;text-align:left;
  transition:color .15s,background .15s,border-color .15s;
}
.nav-item svg{width:15px;height:15px;flex:none;opacity:.8}
.nav-item span{font-size:13px;font-weight:500}
.nav-item .idx{margin-left:auto;font-family:var(--mono);font-size:9px;color:var(--dim);letter-spacing:.08em}
.nav-item:hover{color:var(--text);background:rgba(255,255,255,.035)}
.nav-item.on{color:var(--volt);border-left-color:var(--volt);background:linear-gradient(90deg,rgba(216,255,62,.09),transparent)}
.nav-item.on svg{opacity:1}
.rail-foot{padding:14px 18px 18px;border-top:1px solid var(--line);font-family:var(--mono);font-size:10px;color:var(--dim);display:grid;gap:6px}
.rail-foot b{color:var(--text);font-weight:500}
.main{margin-left:250px;height:100vh;display:flex;flex-direction:column}
.topbar{
  height:58px;flex:none;display:flex;align-items:center;justify-content:space-between;gap:20px;
  padding:0 26px;border-bottom:1px solid var(--line);
  background:rgba(11,14,17,.72);backdrop-filter:blur(14px);position:relative;z-index:10;
}
.crumb{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.04em}
.crumb b{color:var(--text);font-weight:500}
.crumb i{color:var(--dim);font-style:normal}
.top-right{display:flex;align-items:center;gap:14px}
.env-switch{display:flex;border:1px solid var(--line2);border-radius:var(--r);overflow:hidden}
.env-switch button{
  padding:6px 11px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  border-right:1px solid var(--line2);display:flex;align-items:center;gap:6px;
}
.env-switch button:last-child{border-right:0}
.env-switch button.on{background:var(--volt);color:#0B0E11;font-weight:600}
.hdot{width:5px;height:5px;border-radius:50%;background:var(--green);box-shadow:0 0 6px rgba(124,231,178,.8)}
.hdot.warn{background:var(--amber);box-shadow:0 0 6px rgba(255,179,71,.8)}
.hdot.bad{background:var(--red);box-shadow:0 0 6px rgba(255,92,92,.8)}
.ghost{
  border:1px solid var(--line2);padding:7px 11px;border-radius:var(--r);
  font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
  display:flex;align-items:center;gap:7px;transition:.15s;
}
.ghost:hover{color:var(--text);border-color:var(--volt)}
.unread{width:6px;height:6px;border-radius:50%;background:var(--red)}
.user{display:flex;align-items:center;gap:9px;padding-left:14px;border-left:1px solid var(--line)}
.avatar{width:29px;height:29px;display:grid;place-items:center;background:var(--panel3);border:1px solid var(--line2);font-family:var(--disp);font-weight:600;font-size:12px;color:var(--volt)}
.user-meta{line-height:1.2}
.user-meta b{display:block;font-size:12px;font-weight:600}
.user-meta span{font-family:var(--mono);font-size:9px;color:var(--dim);letter-spacing:.08em}
.view{flex:1;overflow-y:auto;padding:26px 30px 70px;scroll-behavior:smooth}

/* ---------- primitives ---------- */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:22px}
.page-head h2{font-family:var(--disp);font-size:29px;font-weight:600;letter-spacing:-.02em;line-height:1.05}
.page-head p{color:var(--muted);font-size:13px;margin-top:6px;max-width:70ch}
.hero{display:grid;grid-template-columns:1.45fr .55fr;gap:30px;padding:8px 0 30px;border-bottom:1px solid var(--line);margin-bottom:22px}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:10px}
.eyebrow::before{content:'';width:22px;height:1px;background:var(--volt)}
.hero h1{font-family:var(--disp);font-weight:800;font-size:clamp(40px,4.4vw,64px);line-height:.92;letter-spacing:-.045em;margin:16px 0 16px}
.hero h1 em{font-style:normal;color:var(--volt)}
.lede{color:var(--muted);font-size:14px;max-width:60ch}
.hero-side{display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;gap:10px}
.dial{width:138px;height:138px;border-radius:50%;background:conic-gradient(var(--amber) 0 62%, #232A33 62% 100%);position:relative;display:grid;place-items:center}
.dial::before{content:'';position:absolute;inset:9px;border-radius:50%;background:var(--ink)}
.dial-in{position:relative;text-align:center}
.dial-in b{display:block;font-family:var(--disp);font-size:34px;line-height:1;color:var(--amber)}
.dial-in span{font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--muted)}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
.metric{border:1px solid var(--line);background:linear-gradient(180deg,var(--panel),rgba(18,22,27,.55));padding:15px 16px 13px;position:relative;overflow:hidden;transition:.18s}
.metric:hover{border-color:var(--line2);transform:translateY(-1px)}
.metric::after{content:'';position:absolute;left:0;top:0;width:2px;height:100%;background:var(--line2)}
.metric.v::after{background:var(--volt)} .metric.a::after{background:var(--amber)} .metric.r::after{background:var(--red)} .metric.c::after{background:var(--cyan)}
.metric-label{font-family:var(--mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.metric-val{font-family:var(--disp);font-size:36px;font-weight:600;line-height:1.1;margin:7px 0 2px;letter-spacing:-.03em}
.metric-val small{font-family:var(--mono);font-size:11px;color:var(--dim);font-weight:400;letter-spacing:0}
.metric-foot{font-family:var(--mono);font-size:10px;color:var(--dim)}
.grid-2{display:grid;grid-template-columns:1.55fr .95fr;gap:16px;align-items:start}
.card{border:1px solid var(--line);background:linear-gradient(180deg,rgba(23,28,34,.75),rgba(18,22,27,.75));padding:17px 18px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:13px}
.card-h h3{font-family:var(--disp);font-size:16px;font-weight:600;letter-spacing:-.01em}
.card-h .tiny{white-space:nowrap}
table{width:100%;border-collapse:collapse}
th{font-family:var(--mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);text-align:left;font-weight:400;padding:0 9px 9px;border-bottom:1px solid var(--line)}
td{padding:11px 9px;border-bottom:1px solid rgba(36,43,51,.62);vertical-align:middle;font-size:13px}
tbody tr{transition:background .14s}
tbody tr:hover{background:rgba(255,255,255,.028)}
tbody tr.click{cursor:pointer}
tbody tr:last-child td{border-bottom:0}
.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border:1px solid var(--line2);border-radius:2px;color:var(--muted);white-space:nowrap}
.pill::before{content:'';width:4px;height:4px;border-radius:50%;background:currentColor}
.pill.ok{color:var(--green);border-color:rgba(124,231,178,.35);background:rgba(124,231,178,.06)}
.pill.run{color:var(--cyan);border-color:rgba(111,227,255,.35);background:rgba(111,227,255,.06)}
.pill.warn{color:var(--amber);border-color:rgba(255,179,71,.4);background:rgba(255,179,71,.07)}
.pill.bad{color:var(--red);border-color:rgba(255,92,92,.4);background:rgba(255,92,92,.07)}
.pill.mute{color:var(--dim)}
.pill.volt{color:#0B0E11;background:var(--volt);border-color:var(--volt);font-weight:600}
.risk{display:inline-flex;align-items:center;gap:7px}
.risk-bars{display:inline-flex;gap:2px}
.risk-bars i{width:5px;height:12px;background:#2C343E;display:block}
.risk.high i:nth-child(-n+3){background:var(--red)}
.risk.mid i:nth-child(-n+2){background:var(--amber)}
.risk.low i:nth-child(1){background:var(--green)}
.risk span{font-family:var(--mono);font-size:10px;color:var(--muted)}
.btn{
  display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);padding:8px 12px;
  border-radius:2px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--text);transition:.15s;white-space:nowrap;
}
.btn:hover{border-color:var(--volt);color:var(--volt)}
.btn.primary{background:var(--volt);border-color:var(--volt);color:#0B0E11;font-weight:600}
.btn.primary:hover{background:#E4FF72;color:#0B0E11}
.btn.danger{border-color:rgba(255,92,92,.45);color:var(--red)}
.btn.danger:hover{background:rgba(255,92,92,.1)}
.btn:disabled{opacity:.35;cursor:not-allowed;border-color:var(--line2);color:var(--dim)}
.btn:disabled:hover{background:none;color:var(--dim)}
.link{color:var(--volt);cursor:pointer;font-size:12px}
.link:hover{text-decoration:underline}
.banner{display:flex;gap:11px;align-items:flex-start;border:1px solid;padding:11px 14px;font-size:12.5px;margin-bottom:16px}
.banner b{font-weight:600}
.banner .code{font-family:var(--mono);font-size:10px;opacity:.75;margin-left:4px}
.banner.warn{border-color:rgba(255,179,71,.4);background:rgba(255,179,71,.07);color:#FFD9A3}
.banner.bad{border-color:rgba(255,92,92,.4);background:rgba(255,92,92,.07);color:#FFB3B3}
.banner.info{border-color:rgba(111,227,255,.35);background:rgba(111,227,255,.06);color:#BDEFFF}
.banner .bicon{font-family:var(--mono);font-size:12px;margin-top:1px}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}
.kv > div{background:var(--panel);padding:11px 13px}
.kv dt{font-family:var(--mono);font-size:9px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim);margin-bottom:3px}
.kv dd{font-size:13px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:0 0 18px}
.tabs button{padding:10px 14px;font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;transition:.15s}
.tabs button:hover{color:var(--text)}
.tabs button.on{color:var(--volt);border-bottom-color:var(--volt)}
.sec-title{display:flex;align-items:center;justify-content:space-between;margin:22px 0 11px}
.sec-title h3{font-family:var(--disp);font-size:17px;font-weight:600}
.empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:13px}
.empty b{display:block;color:var(--text);font-family:var(--disp);font-size:16px;margin-bottom:5px}
.skel{height:13px;background:linear-gradient(90deg,#1A2027,#232B34,#1A2027);background-size:200% 100%;animation:shimmer 1.2s infinite}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.stagger > *{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
.stagger > *:nth-child(1){animation-delay:.02s}.stagger > *:nth-child(2){animation-delay:.06s}
.stagger > *:nth-child(3){animation-delay:.1s}.stagger > *:nth-child(4){animation-delay:.14s}
.stagger > *:nth-child(5){animation-delay:.18s}.stagger > *:nth-child(6){animation-delay:.22s}

/* ---------- workbench ---------- */
.approval-row{display:grid;grid-template-columns:1fr auto;gap:14px;padding:12px 0;border-bottom:1px solid rgba(36,43,51,.62);align-items:center}
.approval-row:last-child{border-bottom:0}
.approval-row .t{font-size:13px;font-weight:500}
.approval-row .m{font-family:var(--mono);font-size:10px;color:var(--dim);margin-top:3px;display:flex;gap:9px;flex-wrap:wrap}
.alert-card{border:1px solid rgba(255,92,92,.38);background:linear-gradient(135deg,rgba(255,92,92,.11),rgba(18,22,27,.6));padding:16px;position:relative;overflow:hidden}
.alert-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--red)}
.alert-card .k{font-family:var(--mono);font-size:9px;letter-spacing:.16em;color:var(--red);text-transform:uppercase}
.alert-card h3{font-family:var(--disp);font-size:17px;font-weight:600;margin:8px 0 6px;line-height:1.25}
.alert-card p{font-size:12px;color:var(--muted);margin-bottom:12px}
.release-row{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid rgba(36,43,51,.6)}
.release-row:last-child{border-bottom:0}
.release-row .id{font-family:var(--mono);font-size:10px;color:var(--muted);width:128px;flex:none}
.release-row .t{flex:1;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chain{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;color:var(--dim);margin-top:4px}
.chain i{width:22px;height:1px;background:var(--line2)}

/* ---------- catalog ---------- */
.catalog{display:grid;grid-template-columns:216px minmax(0,1fr) 330px;gap:14px;align-items:start}
.tree{border:1px solid var(--line);background:rgba(18,22,27,.66);padding:10px 8px}
.tree-app{padding:7px 9px;font-size:12.5px;display:flex;align-items:center;gap:7px;border-radius:2px}
.tree-app b{font-weight:600}
.tree-app .cnt{font-family:var(--mono);font-size:9px;color:var(--dim);margin-left:auto}
.tree-app:hover{background:rgba(255,255,255,.03)}
.tree-sub{padding:5px 9px 5px 24px;font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between;border-left:1px solid var(--line);margin-left:14px}
.tree-sub:hover{color:var(--text)}
.tree-sub.on{color:var(--volt);border-left-color:var(--volt)}
.cfg-table-wrap{border:1px solid var(--line);background:rgba(18,22,27,.66);overflow:hidden}
.cfg-toolbar{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-bottom:1px solid var(--line);gap:10px}
.cfg-toolbar .path{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.05em}
.cfg-row{cursor:pointer}
.cfg-row.on{background:rgba(216,255,62,.05)}
.cfg-row.on td:first-child{box-shadow:inset 2px 0 0 var(--volt)}
.cfg-check{width:26px;padding-right:0!important}
.cfg-check input{width:13px;height:13px;accent-color:var(--volt);cursor:pointer;vertical-align:middle}
.selbar{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid rgba(198,242,78,.3);background:rgba(198,242,78,.06);font-size:12px}
.selbar b{font-family:var(--mono);color:var(--volt)}
.selbar .spacer{flex:1}
.cfg-detail{border:1px solid var(--line);background:linear-gradient(180deg,var(--panel2),rgba(18,22,27,.75));padding:16px;position:sticky;top:0}
.cfg-detail h3{font-family:var(--mono);font-size:13px;word-break:break-all;line-height:1.35}
.detail-tag{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
.value-box{background:#0C1014;border:1px solid var(--line2);padding:11px;font-family:var(--mono);font-size:12px;margin:10px 0;position:relative;word-break:break-all}
.value-box.masked{letter-spacing:.25em;color:var(--muted)}
.value-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.snapshot-note{font-family:var(--mono);font-size:9.5px;color:var(--dim);margin-top:9px;display:flex;align-items:center;gap:6px}

/* ---------- change detail ---------- */
.detail-head{border:1px solid var(--line);background:linear-gradient(120deg,rgba(23,28,34,.9),rgba(18,22,27,.6));padding:19px 20px;margin-bottom:16px;position:relative}
.detail-head::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--amber)}
.detail-no{font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.12em}
.detail-head h2{font-family:var(--disp);font-size:24px;font-weight:600;letter-spacing:-.02em;line-height:1.2;margin:5px 0 12px}
.detail-meta{display:flex;gap:18px;flex-wrap:wrap;font-family:var(--mono);font-size:10px;color:var(--muted)}
.detail-meta b{color:var(--text);font-weight:500}
.action-bar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 18px}
.action-bar .spacer{flex:1}
.diff-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.diff-col{background:#0E1217;min-width:0}
.diff-col-h{display:flex;align-items:center;justify-content:space-between;padding:8px 11px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.diff-col-h b{color:var(--text);font-weight:500}
.diff-line{display:flex;gap:9px;padding:1.5px 10px;font-family:var(--mono);font-size:11.5px;line-height:1.65;white-space:pre;overflow-x:auto}
.diff-line .ln{width:20px;flex:none;color:#3E4750;text-align:right;user-select:none}

function toast(msg, kind=''){
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  el.innerHTML = `<b>${kind==='bad'?'ERROR':kind==='warn'?'ATTENTION':'AUDIT WRITTEN'}</b>${esc(msg)}`;
  $('#toast-root').appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transform='translateY(6px)'; el.style.transition='.3s'; setTimeout(()=>el.remove(),320); }, 3400);
}

    <div class="modal-b">${body}</div>
    <div class="modal-f">${actions.map((a,i)=>`<button class="btn ${a.primary?'primary':''} ${a.danger?'danger':''}" onclick="modalAction(${i})">${esc(a.label)}</button>`).join('')}</div>
  </div></div>`;
}
function closeModal(){ $('#modal-root').innerHTML=''; modalActions=[]; }
function modalAction(i){

}

let changeSeq = 100, batchSeq = 100;
function nowStamp(){
  const d = new Date(), p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function today(){ return nowStamp().slice(0,10).replace(/-/g,''); }
function nextChangeNo(){ changeSeq++; return `CR-${today()}-${String(changeSeq).padStart(4,'0')}`; }
function nextBatchNo(){ batchSeq++; return `BAT-${today()}-${String(batchSeq).padStart(4,'0')}`; }
function hash8(s){
  let h = 2166136261;
  for(let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h,16777619); }
  return (h>>>0).toString(16).padStart(8,'0');
}
function toggleCfgSel(id){
  const i = state.cfgSel.indexOf(id);
  if(i>=0) state.cfgSel.splice(i,1); else state.cfgSel.push(id);
  render();
}
function toggleCfgSelAll(csv){
  const ids = String(csv||'').split(',').filter(Boolean);
  const all = ids.length && ids.every(id=>state.cfgSel.includes(id));
  state.cfgSel = all ? state.cfgSel.filter(id=>!ids.includes(id)) : [...new Set([...state.cfgSel,...ids])];
  render();
}
function clearCfgSel(){ state.cfgSel=[]; render(); }
function contentOf(f, values, maskSensitive=true){
  values = values || {};
  const sep = f.format==='PROPERTIES' ? '=' : ': ';
  return `# ${f.dataId}\n` + f.items.map(it=>{
    let v = Object.prototype.hasOwnProperty.call(values,it.key) ? values[it.key] : it.value;
    if(it.sensitive && maskSensitive) v = '********';
    return `${it.key}${sep}${v}`;
  }).join('\n');
}
function fmtPill(fmt){
  const cls = fmt==='PROPERTIES' ? 'warn' : fmt==='YAML' ? 'run' : 'mute';
  return `<span class="pill ${cls}" style="margin-left:6px">${esc(fmt||'TEXT')}</span>`;
}
function itemInputs(f, prefix, prefill){
  prefill = prefill || {};
  return f.items.map((it,i)=>{
    const val = Object.prototype.hasOwnProperty.call(prefill,it.key) ? prefill[it.key] : (it.sensitive?'':it.value);
    return `<div class="item-edit">
      <div><div class="mono" style="font-size:11px">${esc(it.key)}</div><div class="tiny" style="text-transform:none">${esc(it.desc)}</div></div>
      <div class="mono tiny" style="color:var(--muted)">${it.sensitive?'••••••':esc(it.value)}</div>
      <input id="${prefix}-${i}" value="${esc(val)}" placeholder="${it.sensitive?'输入新值（当前脱敏）':'新值'}">
    </div>`;
  }).join('');
}
function readItemValues(f, prefix){
  const out = {};
  f.items.forEach((it,i)=>{
    const el = document.getElementById(prefix+'-'+i);
    if(!el) return;
    const v = el.value.trim();
    if(it.sensitive){ if(v!=='') out[it.key]=v; }
    else if(v!==it.value) out[it.key]=v;
  });
  return out;
}
function changesOf(f, values){
  return Object.keys(values).map(k=>{
    const it = f.items.find(x=>x.key===k);
    return {key:k, from:it&&it.sensitive?'••••••':(it?it.value:''), to:it&&it.sensitive?'••••••':values[k], sensitive:!!(it&&it.sensitive)};
  });
}
function startChange(id){
  const f = cfg(id);
  if(!f){ toast('请先在配置目录选择一个 DataId','bad'); return; }
  const active = DATA.changes.find(x=>x.fileId===f.id &&
    ['PENDING_APPROVAL','APPROVED','SCHEDULED','RELEASING','INDETERMINATE'].includes(x.status));
  openModal('发起变更 · '+f.dataId, `
    <div class="banner info"><span class="bicon">i</span><div><b>一次变更 = 一个 DataId 文件</b><br>文件内可改多个配置项；草稿不写 TongNCS，提交时才冻结基线。</div></div>
    ${active?`<div class="banner warn"><span class="bicon">!</span><div><b>该 DataId 已有进行中变更单 ${active.no}</b><br>草稿可以保存，但提交时会被阻断；请先处理已有变更单。</div></div>`:''}
    <div class="kv" style="grid-template-columns:1fr 1fr 1fr 1fr">
      <div><dt>DataId</dt><dd class="mono">${esc(f.dataId)}</dd></div>
      <div><dt>格式</dt><dd>${fmtPill(f.format)}</dd></div>
      <div><dt>配置项</dt><dd>${f.items.length} 项</dd></div>
      <div><dt>当前 MD5</dt><dd class="mono">${f.md5}</dd></div>
    </div>
    <div class="tiny" style="margin:12px 0 2px">配置项（只填要改的值；留空或保持原值表示不变）</div>
    ${itemInputs(f,'chg')}
    <label>变更原因（至少 10 个字）</label>
    <textarea id="chg-reason" placeholder="说明为什么改、涉及哪些配置项、影响范围与回滚方式"></textarea>
    <div class="err" id="chg-err"></div>`,
    [{label:'取消'},{label:'创建草稿',primary:true,onClick:()=>{
      const values = readItemValues(f,'chg');
      const chs = changesOf(f,values);
      const r = (document.getElementById('chg-reason')||{}).value || '';
      if(!chs.length){ document.getElementById('chg-err').textContent='至少修改一个配置项'; return false; }
      if(r.trim().length<10){ document.getElementById('chg-err').textContent='变更原因至少 10 个字'; return false; }
      const no = nextChangeNo();
      DATA.changes.unshift({
        no, title:`${f.dataId} · ${chs.length} 项变更`, app:f.app, env:f.env, group:f.group,
        fileId:f.id, dataId:f.dataId, itemChanges:chs,
        type:'UPDATE', status:'DRAFT', risk:f.env==='prod'?'中':'低', submitter:CURRENT_USER, owner:f.owner,
        baseline:'—', draft:hash8(JSON.stringify(values)+f.md5), current:f.md5, drift:false,
        submitted:'—', scheduled:'—', reason:r,
        impact:{instances:0, apps:0, unknown:true, owners:[f.owner]},
        baseContent:contentOf(f), draftContent:contentOf(f,values), sensitiveChanged:chs.some(x=>x.sensitive)
      });
      openChange(no);
      toast('草稿已创建：未写入 TongNCS，提交时冻结基线');
    }}]);
}
function submitDraft(no){
  const c = chg(no); if(!c) return;
  const active = DATA.changes.find(x=>x.no!==no && x.fileId && x.fileId===c.fileId &&
    ['PENDING_APPROVAL','APPROVED','SCHEDULED','RELEASING','INDETERMINATE'].includes(x.status));
  if(active){ toast('同一 DataId 已有进行中变更单 '+active.no,'bad'); return; }
  openModal('提交审批', `
    <p>提交后将冻结基线 <b class="mono">${c.current}</b> 与影响面快照；之后 TongNCS 变化不回写已提交快照。</p>
    <p class="dim" style="font-size:12px;margin-top:8px">一次发布写整个 DataId 文件；提交人不得审批。</p>`,
    [{label:'取消'},{label:'提交并冻结基线',primary:true,onClick:()=>{
      c.baseline = c.current;
      c.status = 'PENDING_APPROVAL';
      c.submitted = nowStamp();
      if(c.impact.unknown && c.risk!=='高') c.risk = c.risk==='低'?'中':'高';
      toast('已提交：基线已冻结，审计已写入');
      render();
    }}]);
}
function batchFromSelection(){
  const sel = state.cfgSel.map(cfg).filter(c=>c && c.env===state.env);
  if(!sel.length){ toast('请先在配置目录勾选 DataId','bad'); return; }
  const conflicts = sel.map(f=>({f, c:DATA.changes.find(x=>x.fileId===f.id &&
    ['PENDING_APPROVAL','APPROVED','SCHEDULED','RELEASING','INDETERMINATE'].includes(x.status))})).filter(x=>x.c);
  if(conflicts.length){
    toast('已有进行中变更单：'+conflicts.map(x=>x.f.dataId+' → '+x.c.no).join('；'),'bad');
    return;
  }
  const totalItems = sel.reduce((n,f)=>n+f.items.length,0);
  openModal('批量发起变更', `
    <div class="banner info"><span class="bicon">i</span><div><b>父单 + ${sel.length} 个 DataId / ${totalItems} 个配置项</b><br>一个 DataId 生成一个子项；子项仍需逐条审批与发布，允许部分成功。</div></div>
    ${sel.map((f,fi)=>`<div class="batch-file">
      <div class="batch-file-h"><div><div class="mono" style="font-size:12px">${esc(f.dataId)} ${fmtPill(f.format)}</div><div class="tiny">${f.items.length} 个配置项 · ${esc(f.app)} / ${(ENV[f.env]||{}).label}</div></div><span class="hash">${f.md5}</span></div>
      ${itemInputs(f,'bat'+fi)}
    </div>`).join('')}
    <div class="err" id="batch-err"></div>`,
    [{label:'取消'},{label:'创建批量草稿',primary:true,onClick:()=>{
      const items = [];
      sel.forEach((f,fi)=>{
        const values = readItemValues(f,'bat'+fi);
        const chs = changesOf(f,values);
        if(chs.length){
          items.push({id:nextChangeNo(), fileId:f.id, dataId:f.dataId, status:'待提交',
            changes:chs, values, baseContent:contentOf(f), draftContent:contentOf(f,values),
            sensitiveChanged:chs.some(x=>x.sensitive)});
        }
      });
      if(!items.length){ document.getElementById('batch-err').textContent='至少在一个配置项里填写新值'; return false; }
      const b = {id:nextBatchNo(), title:`${sel[0].app} 批量调整（${items.length} 个 DataId）`, env:state.env,
        total:items.length, ok:0, fail:0, status:'DRAFT', items};
      DATA.batches.unshift(b);
      state.batchId = b.id; state.cfgSel = [];
      go('batches');
      toast('已创建批量草稿：父单 + '+items.length+' 个 DataId 子项');
    }}]);
}
function curBatch(){ return DATA.batches.find(x=>x.id===state.batchId) || DATA.batches[0]; }
function editBatchItem(i){
  const b = curBatch(); const it = b && b.items[i];
  const f = it && cfg(it.fileId);
  if(!f){ toast('该子项的目标 DataId 不存在','bad'); return; }
  const prefill = {};
  (it.changes||[]).forEach(ch=>{ if(!ch.sensitive) prefill[ch.key]=ch.to; });
  openModal('编辑值 · '+it.dataId, `
    <div class="banner info"><span class="bicon">i</span><div>子项发布时写整个 DataId；敏感项需重新输入，未填表示保持当前值。</div></div>
    ${itemInputs(f,'bedit',prefill)}
    <div class="err" id="bedit-err"></div>`,
    [{label:'取消'},{label:'保存值',primary:true,onClick:()=>{
      const values = readItemValues(f,'bedit');
      const chs = changesOf(f,values);
      if(!chs.length){ document.getElementById('bedit-err').textContent='至少修改一个配置项'; return false; }
      it.changes = chs; it.values = values;
      it.baseContent = contentOf(f); it.draftContent = contentOf(f,values);
      it.sensitiveChanged = chs.some(x=>x.sensitive);
      toast('批量子项的值已更新'); render();
    }}]);
}
function submitBatch(){
  const b = curBatch();
  if(!b || b.status!=='DRAFT') return;
  openModal('提交批量审批', `
    <p>父单提交后，<b>${b.total}</b> 个 DataId 子项一起进入审批；发布时仍按 DataId 逐个写入并读回，允许部分成功。</p>
    <p class="dim" style="font-size:12px;margin-top:8px">父单按最高风险审批；高风险子项由应用负责人审批。</p>`,
    [{label:'取消'},{label:'提交审批',primary:true,onClick:()=>{
      b.status = 'PENDING_APPROVAL';
      b.items.forEach(it=>{ if(it.status==='待提交') it.status='待审批'; });
      toast('批量父单已提交审批');
      render();
    }}]);
}

function requestSensitive(id, key){

  openModal('查看敏感值明文', `

    [{label:'取消'},{label:'确认查看',primary:true,onClick:()=>{

function diffData(c){
  const oldV = c.dataId.includes('timeout')?'3000':c.dataId.includes('pool')?'40':c.dataId.includes('enabled')?'false':'2';
  const newV = c.dataId.includes('timeout')?'5000':c.dataId.includes('pool')?'60':c.dataId.includes('enabled')?'true':'3';
  const base = c.baseContent ? c.baseContent.split('\n') : [`# ${c.dataId}`, `${c.group}:`, `  value: ${oldV}`, `  retry: 2`, `  enabled: true`];
  const draft = c.draftContent ? c.draftContent.split('\n') : [`# ${c.dataId}`, `${c.group}:`, `  value: ${newV}`, `  retry: 2`, `  enabled: true`];
  const cur = c.drift ? [`# ${c.dataId}`, `${c.group}:`, `  value: ${oldV}`, `  retry: 4`, `  enabled: true`] : [...base];
  return {base, draft, cur};
}
function diffCol(title, lines, kind, other){
  return `<div class="diff-col"><div class="diff-col-h"><b>${title}</b><span>${lines.length} lines</span></div>
    ${lines.map((l,i)=>{
      let cls='same';
      if(l!==other[i]) cls = kind==='基线'?'del':kind==='草稿'?'add':'mod';

function releasePanel(c){
  const run = state.releaseRun && state.releaseRun.no===c.no ? state.releaseRun : null;
  const step = run ? run.step : 6;
  const approved = c.status==='APPROVED' || c.status==='SUCCEEDED';
  const items = [
    ['变更单状态为已通过', approved, approved?'':'当前 '+((ST[c.status]||[c.status])[0])],
    ['基线一致', !c.drift, c.drift?'基线已变化':'MD5 '+c.baseline],
    ['发布窗口', true, '全天 · 环境默认'],
    ['TongNCS 实例可用', true, (ENV[c.env]||{}).label+' · '+(ENV[c.env]||{}).latency],
    ['服务账号权限', true, '写权限已确认'],
    ['发布人权限', true, 'PUBLISH · '+esc(c.owner)]
  ];
  const running = run && run.running;
  const result = run && run.result;
  const canRelease = approved && !c.drift && !running;
  let resultHtml = '';
  if(result){
    const cls = result==='verified'?'ok':result==='rejected'?'bad':'warn';
    const title = result==='verified'?'发布成功 · 读回一致':result==='rejected'?'发布失败 · 已拒绝':'结果不确定 · 进入人工对账';
    const desc = result==='verified'?'读回 MD5 与草稿一致，发布记录与审计已写入。':result==='rejected'?'写入被 TongNCS 拒绝，未产生生效变更；可修改后重新提交。':'写入请求已发出但读回无法确认。禁止自动重试，只允许人工对账。';
    resultHtml = `<div class="result ${cls}"><h4>${title}</h4><p>${desc}</p>
      <div class="row"><span>发布记录 <b>${run.relId}</b></span><span>读回 MD5 <b>${result==='verified'?c.draft:'—'}</b></span><span>TraceId <b>${run.trace}</b></span></div>
      ${result==='indeterminate' ? `<div style="margin-top:10px"><button class="btn danger" onclick="reconcile('${c.no}')">进入对账</button></div>` : ''}
    </div>`;
  } else if(running){
    resultHtml = `<div class="result warn"><h4>正在发布 · 第 ${Math.min(step+1,6)} / 6 步</h4><p>写意图 → 写入 TongNCS → 读回比对。每一步结果都会写入审计。</p></div>`;
  } else if(c.status==='INDETERMINATE'){
    resultHtml = `<div class="result warn"><h4>此变更存在不确定结果</h4><p>REL-20261121-0041 的写入结果无法确认，已禁止自动重试；请先完成对账。</p></div>`;
  } else if(c.status==='SUCCEEDED'){
    resultHtml = `<div class="result ok"><h4>已发布</h4><p>发布记录 REL-20261122-0042 · 读回一致 verified。</p></div>`;
  }
  return `
  <div class="precheck">
    ${items.map(([label,ok,why],i)=>`<div class="pc ${ok?'ok':'bad'}"><span class="st">${ok?'✓':'!'}</span><span>${label}</span><span class="why">${why}</span></div>`).join('')}
  </div>
  <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
    <div style="display:flex;align-items:center;gap:9px"><span class="tiny">演示结果</span>
      <div class="seg">${['verified','rejected','indeterminate'].map(o=>`<button class="${state.relOutcome===o?'on':''}" onclick="setRelOutcome('${o}')">${o}</button>`).join('')}</div>
    </div>
    <button class="btn primary" ${canRelease?'':'disabled'} onclick="startRelease('${c.no}')">${running?'发布中…':'执行发布'}</button>
  </div>
  ${!approved&&!result?'<div class="banner info" style="margin-top:14px"><span class="bicon">i</span><div>发布被阻断：变更单尚未审批通过。请先完成单人会签。</div></div>':''}
  ${resultHtml}`;
}
function setRelOutcome(o){ state.relOutcome=o; refreshRelease(); }
function refreshRelease(){
  const c = chg(state.changeNo); const el = document.getElementById('release-panel');
  if(c && el) el.innerHTML = releasePanel(c);
}
function startRelease(no){
  const c = chg(no);
  if(c.status!=='APPROVED'){ toast('变更单未通过审批，无法发布','bad'); return; }
  if(state.releaseRun && state.releaseRun.running) return;
  state.releaseRun = {no, step:0, running:true, result:null, relId:'REL-20261122-0044', trace:'7f3c9a21'};
  refreshRelease();
  const timer = setInterval(()=>{
    const r = state.releaseRun;
    if(!r || r.no!==no || !r.running){ clearInterval(timer); return; }
    r.step++;
    if(r.step>=6){
      clearInterval(timer);
      r.running = false; r.result = state.relOutcome;
      c.status = r.result==='verified'?'SUCCEEDED':r.result==='rejected'?'FAILED':'INDETERMINATE';
      if(r.result==='verified') toast('发布成功：读回 MD5 一致，审计已写入');
      else if(r.result==='rejected') toast('发布失败：TongNCS 拒绝写入，已记录审计','bad');
      else toast('结果不确定：禁止自动重试，请进入对账','warn');
      refreshRelease();
    } else refreshRelease();
  }, 520);
}

      ${DATA.instances.map((x,i)=>`<div class="instance"><div class="top"><div><h4>${x.name}</h4><div class="addr">${x.addr}</div></div><span class="pill ok">健康</span></div>
        <div class="kv" style="grid-template-columns:1fr 1fr"><div><dt>绑定环境</dt><dd>${(ENV[x.env]||{}).label} · ${(ENV[x.env]||{}).name}</dd></div><div><dt>延迟</dt><dd class="mono">${x.latency}</dd></div></div>
        <button class="btn" style="margin-top:10px" onclick="testInstance(${i})">测试连接</button></div>`).join('')}
    </div>
    <div class="banner info" style="margin-top:14px"><span class="bicon">i</span><div>每个环境只能绑定一个实例，同一实例不得复用；连接测试验证连通性与读写权限。实例不健康时阻断该环境所有写操作。</div></div>` : `
    <div class="card" style="padding:6px 16px 10px">
      <table><thead><tr><th>应用</th><th>环境</th><th>企业微信群</th><th>Webhook</th><th>最近推送</th><th></th></tr></thead><tbody>
        ${DATA.bindings.map((b,i)=>`<tr><td>${b.app}</td><td>${envTag(b.env)}</td><td>${b.group}</td><td>${b.webhook==='已绑定'?'<span class="pill ok">已绑定</span>':'<span class="pill warn">待验证</span>'}</td><td class="mono" style="font-size:10px;color:var(--dim)">${b.last}</td><td><button class="btn" onclick="toast('已发送测试消息（演示）')">测试</button></td></tr>`).join('')}
      </tbody></table>
    </div>
    <div class="banner warn" style="margin-top:14px"><span class="bicon">!</span><div>通知失败不阻塞业务；连续失败重试 3 次后只写审计并通知平台管理员，不回滚业务，且通知内容不含敏感明文。</div></div>`;
  return `
  <div class="page-head"><div><h2>管理与设置</h2><p>自建账号与“应用 × 环境”授权；实例与环境一一绑定；通知绑定按应用配置。</p></div><span class="tiny">ADMIN ONLY</span></div>
  <div style="display:flex;gap:6px;margin-bottom:14px">
    ${[['users','账号与授权'],['instances','实例与环境'],['bindings','通知绑定']].map(([k,l])=>`<button class="btn ${t===k?'primary':''}" onclick="state.adminTab='${k}';render()">${l}</button>`).join('')}
  </div>
  ${body}`;
};
function disableUser(i){
  const u = DATA.users[i];
  openModal('禁用账号', `<p>禁用后立即阻断登录与写操作；名下未完成变更单转交应用负责人。动作写入审计。</p><div class="kv"><div><dt>账号</dt><dd>${esc(u.name)} · ${u.account}</dd></div><div><dt>当前状态</dt><dd>${u.status}</dd></div></div>`, [
    {label:'取消'},{label:'确认禁用',danger:true,onClick:()=>{ u.status='已禁用'; toast('账号已禁用，未完成变更单已转交','warn'); render(); }}
  ]);
}
function testInstance(i){
  const x = DATA.instances[i];
  toast(`连接测试通过 · ${x.name} · ${x.latency}`);
}

/* ============ notifications / palette ============ */
function openNotifications(){
  openModal('通知中心', DATA.notifications.map(n=>`<div class="notif"><span class="nd ${n.read?'read':''}"></span><div><b>${esc(n.title)}</b><div class="dim" style="font-size:12px">${esc(n.body)}</div><span>${n.time}</span></div></div>`).join(''), [
    {label:'全部已读',onClick:()=>{ DATA.notifications.forEach(n=>n.read=true); toast('已全部标记为已读'); }},
    {label:'关闭',primary:true}
  ]);
}
function paletteItems(q=''){
  const s = q.trim().toLowerCase();
  const out = [];
  NAV.forEach(g=>g.items.forEach(([v,l])=>out.push({type:'view',v,label:l,group:g.label})));
  DATA.changes.slice(0,5).forEach(c=>out.push({type:'change',v:c.no,label:c.title,group:'变更单'}));
  return out.filter(x=>!s || x.label.toLowerCase().includes(s) || x.v.toLowerCase().includes(s));
}
function openPalette(){
  openModal('命令面板', `<input id="palette-input" placeholder="搜索页面或变更单…" oninput="filterPalette(this.value)" autofocus><div id="palette-list" style="margin-top:8px">${paletteItems('').slice(0,8).map((x,i)=>`<div class="pl" onclick="pickPalette('${x.type}','${x.v}')"><span>${esc(x.label)}</span><span class="k">${x.group} · ${x.type==='view'?'VIEW':'CHANGE'}</span></div>`).join('')}</div>`, []);
  setTimeout(()=>{ const el=document.getElementById('palette-input'); if(el) el.focus(); },30);
}
function filterPalette(q){
  document.getElementById('palette-list').innerHTML = paletteItems(q).slice(0,8).map(x=>`<div class="pl" onclick="pickPalette('${x.type}','${x.v}')"><span>${esc(x.label)}</span><span class="k">${x.group}</span></div>`).join('') || '<div class="empty">没有匹配项</div>';
}
function pickPalette(type, v){
  closeModal();
  if(type==='view') go(v); else openChange(v);
}

/* ============ boot ============ */
function boot(){ render(); }
document.addEventListener('keydown', e=>{
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); openPalette(); }
  if(e.key==='Escape') closeModal();
});
boot();

</script>
</body>
</html>
